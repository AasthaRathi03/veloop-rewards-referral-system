services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veloop
      POSTGRES_PASSWORD: veloop
      POSTGRES_DB: veloop
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://veloop:veloop@db:5432/veloop
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
